<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rehab Tracker Pro</title>
  
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #475569;
      --card-border: #cbd5e1;
      --accent-border: #0284c7;
      --nav-active: #0f172a;
      --nav-inactive: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      -webkit-tap-highlight-color: transparent;
    }

    h1 { font-size: 1.45rem; margin-bottom: 2px; }
    .protocol-tag {
      font-size: 0.85rem;
      font-weight: 700;
      color: #0284c7;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }
    p.subtitle { color: var(--subtext); font-size: 0.9rem; margin-top: 0; margin-bottom: 16px; }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .nav-btn {
      background: none;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: var(--nav-inactive);
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      flex-grow: 1;
    }
    .nav-btn.active {
      color: var(--nav-active);
      background: #e2e8f0;
    }

    /* Views */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Date Navigator */
    .date-navigator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .date-nav-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .date-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .date-input {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 8px;
      font-family: inherit;
      font-weight: 600;
      color: #0f172a;
      font-size: 0.85rem;
      background: #f8fafc;
    }

    /* Cards */
    .section-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 20px 0 10px 0;
      padding-bottom: 4px;
      border-bottom: 2px solid #cbd5e1;
    }

    .card {
      background: var(--card-bg);
      border-left: 5px solid var(--accent-border);
      border-top: 1px solid var(--card-border);
      border-right: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
      padding: 14px 16px;
      border-radius: 8px;
      margin-bottom: 14px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      transition: all 0.2s ease;
    }

    .card.all-completed {
      border-left-color: #22c55e;
      background: #fcfdfd;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .card-title { font-weight: 600; font-size: 1rem; color: var(--text); }
    .card-meta { font-size: 0.85rem; color: var(--subtext); font-weight: 500; margin-top: 2px; }
    
    .card-cue {
      font-size: 0.82rem;
      color: #1e3a8a;
      background: #eff6ff;
      padding: 6px 10px;
      border-radius: 6px;
      margin-top: 8px;
      margin-bottom: 8px;
      display: block;
      font-weight: 500;
      border: 1px solid #bfdbfe;
      line-height: 1.35;
    }

    .video-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #0284c7;
      text-decoration: none;
      background: #ffffff;
      border: 1px solid #bae6fd;
      padding: 4px 10px;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .video-btn:hover { background: #f0f9ff; }

    /* 3-Session Slot Toggles */
    .session-group {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px dashed #e2e8f0;
    }

    .session-btn {
      flex: 1;
      padding: 8px 6px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #475569;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .session-btn.active {
      background: #22c55e;
      border-color: #16a34a;
      color: #ffffff;
      box-shadow: 0 1px 2px rgba(22, 163, 74, 0.25);
    }

    .badge-bar {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      align-items: center;
    }

    .badge {
      display: inline-block;
      background: #e2e8f0;
      color: #334155;
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 600;
    }
    .badge.goal-met { background: #22c55e; color: white; }

    /* History Styles */
    .history-week {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }
    .history-week h3 { margin: 0 0 12px 0; font-size: 1.1rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;}
    
    .hist-item { margin-bottom: 12px; }
    .hist-item-header { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .hist-bar-bg { background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; }
    .hist-bar-fill { height: 100%; border-radius: 5px; transition: width 0.3s; }
    
    .hist-bar-fill.high { background: #22c55e; }
    .hist-bar-fill.med { background: #eab308; }
    .hist-bar-fill.low { background: #ef4444; }

  </style>
</head>
<body>

  <h1>Rehab Tracker Pro</h1>
  <div class="protocol-tag">Maigne's Syndrome — Stage 1</div>
  <p class="subtitle" id="date-display">Loading...</p>

  <div class="nav-tabs">
    <button class="nav-btn active" id="btn-today" onclick="switchTab('today')">Daily Checklist</button>
    <button class="nav-btn" id="btn-history" onclick="switchTab('history')">Progress & History</button>
  </div>

  <!-- ROUTINE VIEW -->
  <div id="view-today" class="view-section active">
    
    <!-- Date Navigator -->
    <div class="date-navigator">
      <button class="date-nav-btn" onclick="navigateDate(-1)">&larr; Prev Day</button>
      <input type="date" id="date-picker" class="date-input" onchange="onDatePickerChange(this.value)">
      <button class="date-nav-btn" id="next-day-btn" onclick="navigateDate(1)">Next Day &rarr;</button>
    </div>

    <div class="section-title">Upper Back & Neck</div>
    <div id="upper-list"></div>

    <div class="section-title">Lower Limb / Hip</div>
    <div id="lower-list"></div>
  </div>

  <!-- HISTORY VIEW -->
  <div id="view-history" class="view-section">
    <div id="history-list"></div>
  </div>

  <script>
    // --- PWA Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('ServiceWorker registered:', reg.scope);
        }).catch(err => {
          console.log('ServiceWorker registration failed:', err);
        });
      });
    }

    // --- Maigne's Syndrome Protocol (3x/day across 7 days = 21 weekly sets) ---
    const exercises = [
      // Upper Back and Neck
      { 
        id: "m1", 
        cat: "upper", 
        name: "Foam roller head nods", 
        freq: "Daily: 12 reps (1 set 3x/day)", 
        targetWeekly: 21,
        cue: null,
        video: "#" 
      },

      // Lower Limb / Hip
      { 
        id: "m2", 
        cat: "lower", 
        name: "Knee to chest stretch", 
        freq: "3x Daily: 1–2 min", 
        targetWeekly: 21,
        cue: "Focus on flex in upper lumbar (bring rib down without switching on core)",
        video: null 
      },
      { 
        id: "m3", 
        cat: "lower", 
        name: "Side lying overbook stretch", 
        freq: "3x Daily: 1–2 min", 
        targetWeekly: 21,
        cue: "Attempt to relax and breathe (have knee up against an object)",
        video: null 
      },
      { 
        id: "m4", 
        cat: "lower", 
        name: "Neutral to child pose", 
        freq: "3x Daily: 1–2 min", 
        targetWeekly: 21,
        cue: "Gentle rocking into position (towel up under ribcage - focus on flexing mid back - avoid lower back)",
        video: null 
      },
      { 
        id: "m5", 
        cat: "lower", 
        name: "90/90 table top breathing", 
        freq: "3x Daily: 1–2 min", 
        targetWeekly: 21,
        cue: "Lower leg on top of chair and keep lumbar neutral and breathe into back.",
        video: null 
      }
    ];

    // --- Date State ---
    let selectedDate = getTodayStr();

    // --- Date Utilities ---
    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function getMonday(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff));
      return monday.getFullYear() + '-' + String(monday.getMonth()+1).padStart(2, '0') + '-' + String(monday.getDate()).padStart(2, '0');
    }

    function formatDate(dateStr) {
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', options);
    }

    // --- State Management ---
    function loadState() { return JSON.parse(localStorage.getItem('rehab_history_pwa') || '{}'); }
    function saveState(state) { localStorage.setItem('rehab_history_pwa', JSON.stringify(state)); }

    // Toggle specific slot ('morning', 'midday', 'evening')
    function toggleSlot(id, slot) {
      const state = loadState();
      if (!state[selectedDate]) state[selectedDate] = {};
      
      // Ensure backwards-compatible object structure
      if (!state[selectedDate][id] || typeof state[selectedDate][id] !== 'object') {
        state[selectedDate][id] = { morning: false, midday: false, evening: false };
      }
      
      state[selectedDate][id][slot] = !state[selectedDate][id][slot];
      saveState(state);
      renderRoutine();
    }

    // Count completed sets for an exercise on a single day
    function getDayExerciseSetCount(dayRecord, exId) {
      if (!dayRecord || !dayRecord[exId]) return 0;
      const data = dayRecord[exId];
      if (typeof data === 'boolean') return data ? 3 : 0; // Legacy support
      let count = 0;
      if (data.morning) count++;
      if (data.midday) count++;
      if (data.evening) count++;
      return count;
    }

    // Calculate total sets done in the week starting at mondayStr
    function getWeeklyCounts(state, mondayStr) {
      let counts = {};
      exercises.forEach(ex => counts[ex.id] = 0);
      for (let i = 0; i < 7; i++) {
        let d = new Date(mondayStr + 'T00:00:00');
        d.setDate(d.getDate() + i);
        let dStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        if (state[dStr]) {
          exercises.forEach(ex => {
            counts[ex.id] += getDayExerciseSetCount(state[dStr], ex.id);
          });
        }
      }
      return counts;
    }

    // --- Date Navigation Logic ---
    function navigateDate(offsetDays) {
      let d = new Date(selectedDate + 'T00:00:00');
      d.setDate(d.getDate() + offsetDays);
      let newDateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      
      if (newDateStr > getTodayStr()) return;
      selectedDate = newDateStr;
      renderRoutine();
    }

    function onDatePickerChange(val) {
      if (!val) return;
      if (val > getTodayStr()) {
        alert("Cannot log exercises for future dates.");
        selectedDate = getTodayStr();
      } else {
        selectedDate = val;
      }
      renderRoutine();
    }

    // --- UI Rendering ---
    function renderRoutine() {
      const today = getTodayStr();
      const currentMonday = getMonday(selectedDate);
      const state = loadState();
      const dayData = state[selectedDate] || {};
      const weeklyCounts = getWeeklyCounts(state, currentMonday);

      // Date Picker Controls
      const picker = document.getElementById('date-picker');
      picker.value = selectedDate;
      picker.max = today;

      const nextBtn = document.getElementById('next-day-btn');
      nextBtn.disabled = (selectedDate >= today);

      let isToday = (selectedDate === today);
      document.getElementById('date-display').innerText = (isToday ? "Today, " : "Logging for ") + formatDate(selectedDate);
      
      const upperEl = document.getElementById('upper-list');
      const lowerEl = document.getElementById('lower-list');
      upperEl.innerHTML = ''; lowerEl.innerHTML = '';

      exercises.forEach(ex => {
        const rawSlots = dayData[ex.id] || {};
        const isMorn = typeof rawSlots === 'boolean' ? rawSlots : !!rawSlots.morning;
        const isMid = typeof rawSlots === 'boolean' ? rawSlots : !!rawSlots.midday;
        const isEve = typeof rawSlots === 'boolean' ? rawSlots : !!rawSlots.evening;

        const daySetsDone = (isMorn ? 1 : 0) + (isMid ? 1 : 0) + (isEve ? 1 : 0);
        const allDayDone = daySetsDone === 3;
        
        const weekSetsDone = weeklyCounts[ex.id];
        const weekGoalMet = weekSetsDone >= ex.targetWeekly;

        const card = document.createElement('div');
        card.className = `card ${allDayDone ? 'all-completed' : ''}`;
        
        let cueHTML = ex.cue ? `<div class="card-cue">💡 <strong>Cue:</strong> ${ex.cue}</div>` : '';
        let videoHTML = ex.video && ex.video !== "#" 
          ? `<div><a href="${ex.video}" target="_blank" rel="noopener noreferrer" class="video-btn">▶ Watch Video</a></div>` 
          : '';

        card.innerHTML = `
          <div class="card-top">
            <div>
              <div class="card-title">${ex.name}</div>
              <div class="card-meta">${ex.freq}</div>
            </div>
          </div>

          ${cueHTML}
          ${videoHTML}

          <div class="session-group">
            <button class="session-btn ${isMorn ? 'active' : ''}" onclick="toggleSlot('${ex.id}', 'morning')">
              <span>${isMorn ? '✓' : '○'}</span> Morning
            </button>
            <button class="session-btn ${isMid ? 'active' : ''}" onclick="toggleSlot('${ex.id}', 'midday')">
              <span>${isMid ? '✓' : '○'}</span> Midday
            </button>
            <button class="session-btn ${isEve ? 'active' : ''}" onclick="toggleSlot('${ex.id}', 'evening')">
              <span>${isEve ? '✓' : '○'}</span> Evening
            </button>
          </div>

          <div class="badge-bar">
            <span class="badge ${allDayDone ? 'goal-met' : ''}">${daySetsDone} / 3 today</span>
            <span class="badge ${weekGoalMet ? 'goal-met' : ''}">${weekSetsDone} / ${ex.targetWeekly} this week</span>
          </div>
        `;

        if (ex.cat === 'upper') upperEl.appendChild(card);
        else lowerEl.appendChild(card);
      });
    }

    function renderHistory() {
      const state = loadState();
      const historyList = document.getElementById('history-list');
      historyList.innerHTML = '';

      const uniqueMondays = [...new Set(Object.keys(state).map(d => getMonday(d)))].sort().reverse();

      if (uniqueMondays.length === 0) {
        historyList.innerHTML = '<p style="text-align:center; color:#64748b; margin-top: 40px;">No history recorded yet. Complete exercises to build your streak!</p>';
        return;
      }

      uniqueMondays.forEach(monday => {
        const counts = getWeeklyCounts(state, monday);
        
        const weekCard = document.createElement('div');
        weekCard.className = 'history-week';
        
        let header = `<h3>Week of ${formatDate(monday)}</h3>`;
        let itemsHTML = '';

        exercises.forEach(ex => {
          const setsDone = counts[ex.id];
          if (setsDone === 0) return;
          
          let pct = Math.min(100, Math.round((setsDone / ex.targetWeekly) * 100));
          let barClass = pct >= 100 ? 'high' : (pct >= 50 ? 'med' : 'low');

          itemsHTML += `
            <div class="hist-item">
              <div class="hist-item-header">
                <span>${ex.name}</span>
                <span>${pct}% (${setsDone}/${ex.targetWeekly} sets)</span>
              </div>
              <div class="hist-bar-bg">
                <div class="hist-bar-fill ${barClass}" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        });

        weekCard.innerHTML = header + (itemsHTML || '<p style="font-size:0.9rem; color:#64748b;">No exercises logged for this week.</p>');
        historyList.appendChild(weekCard);
      });
    }

    function switchTab(tab) {
      document.getElementById('view-today').classList.remove('active');
      document.getElementById('view-history').classList.remove('active');
      document.getElementById('btn-today').classList.remove('active');
      document.getElementById('btn-history').classList.remove('active');

      document.getElementById(`view-${tab}`).classList.add('active');
      document.getElementById(`btn-${tab}`).classList.add('active');

      if (tab === 'today') renderRoutine();
      if (tab === 'history') renderHistory();
    }

    // Init
    renderRoutine();

  </script>
</body>
</html>
