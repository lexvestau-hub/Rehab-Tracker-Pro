<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rehab Tracker Pro</title>
  
  <!-- PWA Manifest Link -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #475569;
      --card-border: #cbd5e1;
      --accent-border: #0284c7;
      --nav-active: #0f172a;
      --nav-inactive: #94a3b8;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      -webkit-tap-highlight-color: transparent;
    }

    h1 { font-size: 1.5rem; margin-bottom: 4px; }
    p.subtitle { color: var(--subtext); font-size: 0.9rem; margin-top: 0; margin-bottom: 16px; }

    /* Navigation Tabs */
    .nav-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .nav-btn {
      background: none;
      border: none;
      font-size: 1rem;
      font-weight: 600;
      color: var(--nav-inactive);
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      flex-grow: 1;
    }
    .nav-btn.active {
      color: var(--nav-active);
      background: #e2e8f0;
    }

    /* Views */
    .view-section { display: none; }
    .view-section.active { display: block; }

    /* Date Navigator */
    .date-navigator {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #ffffff;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .date-nav-btn {
      background: #f1f5f9;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .date-nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .date-input {
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 8px;
      font-family: inherit;
      font-weight: 600;
      color: #0f172a;
      font-size: 0.85rem;
      background: #f8fafc;
    }

    /* Cards */
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin: 20px 0 10px 0;
      padding-bottom: 4px;
      border-bottom: 2px solid #cbd5e1;
    }

    .card {
      background: var(--card-bg);
      border-left: 5px solid var(--accent-border);
      border-top: 1px solid var(--card-border);
      border-right: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
      transition: opacity 0.3s ease;
    }

    .card-info { flex-grow: 1; padding-right: 12px; }
    .card-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px;}
    .card-meta { font-size: 0.85rem; color: var(--subtext); }
    
    .card-note {
      font-size: 0.8rem;
      color: #991b1b;
      background: #fee2e2;
      padding: 4px 8px;
      border-radius: 4px;
      margin-top: 6px;
      display: inline-block;
      font-weight: 600;
      border: 1px solid #f87171;
    }

    .video-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 6px;
      margin-right: 4px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #0284c7;
      text-decoration: none;
      background: #ffffff;
      border: 1px solid #bae6fd;
      padding: 4px 10px;
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .video-btn:hover { background: #f0f9ff; }
    .video-btn.disabled {
      color: #94a3b8;
      background: #f1f5f9;
      border-color: #e2e8f0;
      cursor: not-allowed;
      box-shadow: none;
    }

    .badge {
      display: inline-block;
      background: #e2e8f0;
      color: #334155;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
      margin-top: 6px;
    }
    .badge.goal-met { background: #22c55e; color: white; }

    input[type="checkbox"].ex-check {
      width: 28px;
      height: 28px;
      cursor: pointer;
      accent-color: #16a34a;
    }

    .completed .card-title, .completed .card-meta, .completed .card-note {
      opacity: 0.5;
    }
    .completed .card-title { text-decoration: line-through; }

    /* History Styles */
    .history-week {
      background: white;
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border: 1px solid #e2e8f0;
    }
    .history-week h3 { margin: 0 0 12px 0; font-size: 1.1rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;}
    
    .hist-item { margin-bottom: 12px; }
    .hist-item-header { display: flex; justify-content: space-between; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; }
    .hist-bar-bg { background: #e2e8f0; height: 10px; border-radius: 5px; overflow: hidden; }
    .hist-bar-fill { height: 100%; border-radius: 5px; transition: width 0.3s; }
    
    .hist-bar-fill.high { background: #22c55e; }
    .hist-bar-fill.med { background: #eab308; }
    .hist-bar-fill.low { background: #ef4444; }

  </style>
</head>
<body>

  <h1>Rehab Program Tracker</h1>
  <p class="subtitle" id="date-display">Loading...</p>

  <div class="nav-tabs">
    <button class="nav-btn active" id="btn-today" onclick="switchTab('today')">Daily Checklist</button>
    <button class="nav-btn" id="btn-history" onclick="switchTab('history')">Progress & History</button>
  </div>

  <!-- DAILY & WEEKLY ROUTINE VIEW -->
  <div id="view-today" class="view-section active">
    
    <!-- Date Navigator -->
    <div class="date-navigator">
      <button class="date-nav-btn" onclick="navigateDate(-1)">&larr; Prev Day</button>
      <input type="date" id="date-picker" class="date-input" onchange="onDatePickerChange(this.value)">
      <button class="date-nav-btn" id="next-day-btn" onclick="navigateDate(1)">Next Day &rarr;</button>
    </div>

    <div class="section-title">Daily Exercises</div>
    <div id="daily-list"></div>

    <div class="section-title">3–4 Times a Week</div>
    <div id="weekly-list"></div>
  </div>

  <!-- HISTORY VIEW -->
  <div id="view-history" class="view-section">
    <div id="history-list"></div>
  </div>

  <script>
    // --- PWA Service Worker Registration ---
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('ServiceWorker registered:', reg.scope);
        }).catch(err => {
          console.log('ServiceWorker registration failed:', err);
        });
      });
    }

    // --- Data Configuration ---
    const exercises = [
      // Daily Exercises
      { id: "e1", cat: "daily", name: "Denneroll", freq: "Daily: 3min - 20min", target: 7, video: "https://www.youtube.com/watch?v=UtFdhy04uQc" },
      { id: "e3", cat: "daily", name: "Prone Chin tuck", freq: "Daily: 10 reps x 3 sets", target: 7, video: "https://www.tiktok.com/@kai.chiropractic/video/7536468644595780871" },
      { id: "e6", cat: "daily", name: "Foam roller Overhead reach", freq: "Daily: 20 reps", target: 7, video: null, pendingNote: "Video in creation" },
      { id: "e8", cat: "daily", name: "Side lying Hip rotations", freq: "Daily: 12 reps x 2 sets", target: 7, video: ["https://www.youtube.com/shorts/LKt1WTeVt4Y", "https://www.youtube.com/shorts/jQ9tNlyMm5o"] },

      // 3-4 Times a Week Exercises
      { id: "e4", cat: "weekly", name: "Laying serratus punch", freq: "3-4/Wk: 10 reps x 3 sets", target: 4, video: null },
      { id: "e14", cat: "weekly", name: "External rotator cuff", freq: "3/wk: 10 reps x 3 sets", target: 3, video: null },
      { id: "e10", cat: "weekly", name: "Resisted Dorsiflexion", freq: "4/wk: 8-12 reps x 3 sets", target: 4, video: "https://www.youtube.com/shorts/BzTwD3CqvZg" },
      { id: "e13", cat: "weekly", name: "Jefferson Curl", freq: "4/wk: 10 reps x 1 set", target: 4, video: "https://www.instagram.com/reel/DYFQlyOuAGq/" },
      { id: "e15", cat: "weekly", name: "Standing banded march", freq: "3/wk: 8 reps x 2 sets", target: 3, video: null },
      { id: "e12", cat: "weekly", name: "Toe elevated Calf raise", freq: "4/wk: 10 reps x 2-3 sets", target: 4, video: "https://www.youtube.com/shorts/uejJNy6O81I" }
    ];

    // --- Date State ---
    let selectedDate = getTodayStr();

    // --- Date Utilities ---
    function getTodayStr() {
      const d = new Date();
      return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }

    function getMonday(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const day = d.getDay();
      const diff = d.getDate() - day + (day === 0 ? -6 : 1);
      const monday = new Date(d.setDate(diff));
      return monday.getFullYear() + '-' + String(monday.getMonth()+1).padStart(2, '0') + '-' + String(monday.getDate()).padStart(2, '0');
    }

    function formatDate(dateStr) {
      const options = { weekday: 'long', month: 'short', day: 'numeric' };
      return new Date(dateStr + 'T00:00:00').toLocaleDateString('en-US', options);
    }

    // --- State Management ---
    function loadState() { return JSON.parse(localStorage.getItem('rehab_history_pwa') || '{}'); }
    function saveState(state) { localStorage.setItem('rehab_history_pwa', JSON.stringify(state)); }

    function toggleExercise(id) {
      const state = loadState();
      if (!state[selectedDate]) state[selectedDate] = {};
      state[selectedDate][id] = !state[selectedDate][id];
      saveState(state);
      renderRoutine();
    }

    // --- Date Navigation Logic ---
    function navigateDate(offsetDays) {
      let d = new Date(selectedDate + 'T00:00:00');
      d.setDate(d.getDate() + offsetDays);
      let newDateStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      
      if (newDateStr > getTodayStr()) return;
      selectedDate = newDateStr;
      renderRoutine();
    }

    function onDatePickerChange(val) {
      if (!val) return;
      if (val > getTodayStr()) {
        alert("Cannot log exercises for future dates.");
        selectedDate = getTodayStr();
      } else {
        selectedDate = val;
      }
      renderRoutine();
    }

    function getWeeklyCounts(state, mondayStr) {
      let counts = {};
      exercises.forEach(ex => counts[ex.id] = 0);
      for (let i = 0; i < 7; i++) {
        let d = new Date(mondayStr + 'T00:00:00');
        d.setDate(d.getDate() + i);
        let dStr = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        if (state[dStr]) {
          exercises.forEach(ex => { if (state[dStr][ex.id]) counts[ex.id]++; });
        }
      }
      return counts;
    }

    // --- UI Rendering ---
    function renderRoutine() {
      const today = getTodayStr();
      const currentMonday = getMonday(selectedDate);
      const state = loadState();
      const selectedDayState = state[selectedDate] || {};
      const weeklyCounts = getWeeklyCounts(state, currentMonday);

      // Date Picker Controls
      const picker = document.getElementById('date-picker');
      picker.value = selectedDate;
      picker.max = today;

      const nextBtn = document.getElementById('next-day-btn');
      nextBtn.disabled = (selectedDate >= today);

      let isToday = (selectedDate === today);
      document.getElementById('date-display').innerText = (isToday ? "Today, " : "Logging for ") + formatDate(selectedDate);
      
      const dailyEl = document.getElementById('daily-list');
      const weeklyEl = document.getElementById('weekly-list');
      dailyEl.innerHTML = ''; weeklyEl.innerHTML = '';

      exercises.forEach(ex => {
        const isChecked = !!selectedDayState[ex.id];
        const currentCount = weeklyCounts[ex.id];
        const goalMet = currentCount >= ex.target;

        const card = document.createElement('div');
        card.className = `card ${isChecked ? 'completed' : ''}`;
        
        let noteHTML = ex.note ? `<div class="card-note">⚠️ ${ex.note}</div>` : '';
        
        let videoHTML = '';
        let videoList = Array.isArray(ex.video) ? ex.video : (ex.video !== undefined ? [ex.video] : []);

        if (videoList.length > 0) {
          videoHTML = videoList.map((vUrl, idx) => {
            let label = videoList.length > 1 ? `▶ Video ${idx + 1}` : `▶ Watch Video`;
            if (vUrl && vUrl.startsWith('http')) {
              return `<a href="${vUrl}" target="_blank" rel="noopener noreferrer" class="video-btn">${label}</a>`;
            } else {
              let pendingText = videoList.length > 1 ? `⏳ Video ${idx + 1} pending` : `⏳ ${ex.pendingNote || 'Video pending'}`;
              return `<span class="video-btn disabled">${pendingText}</span>`;
            }
          }).join(' ');
        } else {
          videoHTML = `<span class="video-btn disabled">⏳ ${ex.pendingNote || 'Video pending'}</span>`;
        }

        card.innerHTML = `
          <div class="card-info">
            <div class="card-title">${ex.name}</div>
            <div class="card-meta">${ex.freq}</div>
            ${noteHTML}
            <div style="margin-top: 4px;">${videoHTML}</div>
            <div class="badge ${goalMet ? 'goal-met' : ''}">${currentCount} / ${ex.target} days done this week</div>
          </div>
          <input type="checkbox" class="ex-check" ${isChecked ? 'checked' : ''} onchange="toggleExercise('${ex.id}')">
        `;

        if (ex.cat === 'daily') dailyEl.appendChild(card);
        else weeklyEl.appendChild(card);
      });
    }

    function renderHistory() {
      const state = loadState();
      const historyList = document.getElementById('history-list');
      historyList.innerHTML = '';

      const uniqueMondays = [...new Set(Object.keys(state).map(d => getMonday(d)))].sort().reverse();

      if (uniqueMondays.length === 0) {
        historyList.innerHTML = '<p style="text-align:center; color:#64748b; margin-top: 40px;">No history recorded yet. Complete exercises to build your streak!</p>';
        return;
      }

      uniqueMondays.forEach(monday => {
        const counts = getWeeklyCounts(state, monday);
        
        const weekCard = document.createElement('div');
        weekCard.className = 'history-week';
        
        let header = `<h3>Week of ${formatDate(monday)}</h3>`;
        let itemsHTML = '';

        exercises.forEach(ex => {
          const count = counts[ex.id];
          if (count === 0) return;
          
          let pct = Math.min(100, Math.round((count / ex.target) * 100));
          let barClass = pct >= 100 ? 'high' : (pct >= 50 ? 'med' : 'low');

          itemsHTML += `
            <div class="hist-item">
              <div class="hist-item-header">
                <span>${ex.name}</span>
                <span>${pct}% (${count}/${ex.target})</span>
              </div>
              <div class="hist-bar-bg">
                <div class="hist-bar-fill ${barClass}" style="width: ${pct}%"></div>
              </div>
            </div>
          `;
        });

        weekCard.innerHTML = header + (itemsHTML || '<p style="font-size:0.9rem; color:#64748b;">No exercises logged.</p>');
        historyList.appendChild(weekCard);
      });
    }

    function switchTab(tab) {
      document.getElementById('view-today').classList.remove('active');
      document.getElementById('view-history').classList.remove('active');
      document.getElementById('btn-today').classList.remove('active');
      document.getElementById('btn-history').classList.remove('active');

      document.getElementById(`view-${tab}`).classList.add('active');
      document.getElementById(`btn-${tab}`).classList.add('active');

      if (tab === 'today') renderRoutine();
      if (tab === 'history') renderHistory();
    }

    // Init
    renderRoutine();

  </script>
</body>
</html>
